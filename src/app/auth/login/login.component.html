<div class="login-page">
    <div class="login-card">
        <div class="brand-bar">
            <p>Sign in to your dashboard</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
            <div class="form-group">
                <input type="email" class="form-control" formControlName="username" placeholder="Username" />

                <small class="text-danger"
                    *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
                    Valid email is required.
                </small>
            </div>

            <div class="form-group">
                <input type="password" class="form-control" formControlName="password" placeholder="Password" />

                <small class="text-danger"
                    *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                    Password is required.
                </small>
            </div>

            <div class="alert alert-danger" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <div class="button-row">
                <button type="submit" class="btn btn-primary sign-in-btn" [disabled]="loginForm.invalid || isLoading">
                    {{ isLoading ? 'Signing in...' : 'SIGN IN' }}
                </button>
            </div>
        </form>
    </div>
</div>
